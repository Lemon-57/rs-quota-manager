[package]
name = "quota-manager"
version = "0.1.8"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "402bc37fbb5c83378cc83cec89e9fa251e4a99c1", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt", "sync", "time"] }
uuid = { version = "1.23.4", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
